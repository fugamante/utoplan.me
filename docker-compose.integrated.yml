services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "8080"
      UTOPLAN_API_ORIGIN: http://api:3001
    command: ["sh", "-c", "node scripts/verify_deployment_config.js --service=app && npm run start:app"]
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8080/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build:
      context: .
      dockerfile: Dockerfile.modern-api
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_HOST: ${DATABASE_HOST:?DATABASE_HOST is required}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USER: ${DATABASE_USER:?DATABASE_USER is required}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      DATABASE_DB: ${DATABASE_DB:?DATABASE_DB is required}
    command: ["sh", "-c", "node scripts/verify_deployment_config.js --service=api && node dtoapi/modern/lib/server.js"]
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
