name: PR validation

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        # actions/setup-node v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
          cache: npm

      - name: Report tool versions
        run: |
          node --version
          npm --version
          docker --version

      - name: Install workspace dependencies
        run: npm run install:all

      - name: Build and run contract tests
        run: npm run build

      - name: Install Chromium browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:browser

      - name: Release preflight configuration contract
        run: npm run verify:release
        env:
          UTOPLAN_RELEASE_SAMPLE: '1'

      - name: Docker DB contract tests
        run: npm run docker:test:db

      - name: Docker start:local browser smoke test
        run: npm run docker:test:start-local-browser
