name: PR validation

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node.js
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '26'
          cache: npm

      - name: Report tool versions
        run: |
          node --version
          npm --version
          docker --version

      - name: Install workspace dependencies
        run: npm run install:all

      - name: Build and run contract tests
        run: npm run build

      - name: Install Chromium browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:browser

      - name: Release preflight configuration contract
        run: npm run verify:release
        env:
          UTOPLAN_RELEASE_SAMPLE: '1'

      - name: Docker DB contract tests
        run: npm run docker:test:db

      - name: Docker start:local browser smoke test
        run: npm run docker:test:start-local-browser
