services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres-anonymous-test
    environment:
      POSTGRES_DB: dtoapi_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dtoapi_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.modern-api
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_DB: dtoapi_test
      UTOPLAN_ANONYMOUS_RUNTIME: "1"
      UTOPLAN_ANONYMOUS_RATE_LIMIT_MODE: shared
      UTOPLAN_ANONYMOUS_SHARED_RATE_LIMIT: "1"
      UTOPLAN_ANONYMOUS_ALLOWED_ORIGINS: http://127.0.0.1:18084,http://localhost:18084
      UTOPLAN_TRUST_PROXY: "1"
    ports:
      - "13001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/readyz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "8080"
      UTOPLAN_API_ORIGIN: http://api:3001
    ports:
      - "18084:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8080/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
