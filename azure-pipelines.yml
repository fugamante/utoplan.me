# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
- master

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '22.x'
  displayName: 'Install Node.js'

- script: |
    npm run install:all
    npm run build
  displayName: 'npm install and build'

- script: |
    npx playwright install --with-deps chromium
    npm run test:browser
  displayName: 'Browser smoke tests'

- script: |
    npm run verify:release
  displayName: 'Release preflight configuration contract'
  env:
    UTOPLAN_RELEASE_SAMPLE: '1'

- script: |
    npm run docker:test:db
  displayName: 'Docker DB contract tests'
  env:
    COMPOSE_PROJECT_NAME: 'utoplan_db_$(Build.BuildId)'

- script: |
    npm run docker:test:proxy
  displayName: 'Docker app/API proxy contract tests'
  env:
    COMPOSE_PROJECT_NAME: 'utoplan_proxy_$(Build.BuildId)'

- script: |
    npm run docker:test:start-local-browser
  displayName: 'Docker start:local browser smoke test'
  env:
    COMPOSE_PROJECT_NAME: 'utoplan_start_$(Build.BuildId)'

- script: |
    npm run docker:test:anonymous-runtime
  displayName: 'Docker anonymous runtime smoke test'
  env:
    COMPOSE_PROJECT_NAME: 'utoplan_anon_$(Build.BuildId)'
